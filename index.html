<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Untuk Yasmine</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-hearts" id="bgHearts" aria-hidden="true"></div>

  <!-- 1. Landing -->
  <main class="page active" id="landing">
    <div class="stack">
      <h1 data-text="landing.title"></h1>
      <p class="lead" data-text="landing.subtitle"></p>
      <button class="btn primary" id="startBtn" data-text="landing.button"></button>
    </div>
  </main>

  <!-- 2. PIN -->
  <main class="page" id="pin">
    <div class="stack">
      <h2 data-text="pin.title"></h2>
      <p class="lead" data-text="pin.hint"></p>
      <div class="pin-row" id="pinRow" role="group" aria-label="PIN"></div>
      <button class="btn primary" id="pinBtn" data-text="pin.button"></button>
    </div>
  </main>

  <!-- 3. Love Letter -->
  <main class="page" id="letter">
    <div class="stack wide">
      <article class="paper">
        <div class="seal" aria-hidden="true">♥</div>
        <p class="greeting" id="letterGreeting"></p>
        <div id="letterBody"></div>
        <p class="closing" id="letterClosing"></p>
        <p class="signature" id="letterSignature"></p>
      </article>
      <div class="letter-actions">
        <button class="btn ghost" id="musicBtn" aria-pressed="false">
          <span id="musicIcon">♪</span> <span id="musicLabel"></span>
        </button>
        <button class="btn primary" id="continueBtn" data-text="letter.continueButton"></button>
      </div>
    </div>
  </main>

  <!-- 4. Proposal -->
  <main class="page" id="proposal">
    <div class="stack">
      <h2 class="question" data-text="proposal.question"></h2>
      <div class="choices" id="choices">
        <button class="btn primary big" id="yesBtn" data-text="proposal.yes"></button>
        <button class="btn ghost big" id="noBtn" data-text="proposal.no"></button>
      </div>
    </div>
  </main>

  <!-- 5. Final -->
  <main class="page" id="final">
    <div class="stack wide">
      <h2 data-text="final.title"></h2>
      <p class="lead" data-text="final.message"></p>
      <div class="gifts" id="gifts"></div>
    </div>
  </main>

  <!-- Popup error PIN -->
  <div class="modal" id="modal" role="alertdialog" aria-modal="true" aria-labelledby="modalText" hidden>
    <div class="modal-box">
      <p id="modalText"></p>
      <button class="btn primary" id="modalBtn"></button>
    </div>
  </div>

  <audio id="bgm" loop preload="auto"></audio>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
